
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raj Kumar Nayak - RCB Fan</title>

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
}
header {
    background: linear-gradient(135deg, #e60023, #111);
    padding: 35px 15px;
}
h1 {
    font-size: 38px;
    margin: 10px;
}
.logo {
    font-size: 75px;
}
.card {
    background: #222;
    margin: 20px auto;
    padding: 25px;
    max-width: 500px;
    border-radius: 18px;
    border: 2px solid #e60023;
}
h2 {
    color: #ff3048;
}
button {
    background: #e60023;
    color: white;
    padding: 13px 24px;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
}
button:hover {
    background: #b0001b;
}
footer {
    padding: 20px;
    color: #ccc;
}
</style>
</head>

<body>

<header>
    <div class="logo">🏏</div>
    <h1>ROYAL CHALLENGERS BENGALURU</h1>
    <p>❤️ RCB Forever • Ee Sala Cup Namde! 🖤</p>
</header>

<div class="card">
    <h2>मेरा परिचय</h2>
    <h3>नाम: Raj Kumar Nayak</h3>
    <p>कक्षा: 9th</p>
    <p>मैं RCB का फैन हूँ! ❤️</p>
    <button onclick="showMessage()">RCB ❤️</button>
    <p id="message"></p>
</div>

<div class="card">
    <h2>RCB टीम 🏆</h2>
    <p>🔴 लाल और ⚫ काला</p>
    <p>🏏 क्रिकेट • जुनून • विश्वास</p>
    <p>एक सच्चे RCB फैन की वेबसाइट!</p>
</div>

<footer>
    <p>Made by Raj Kumar Nayak</p>
    <p>Class 9th | RCB Fan Website</p>
</footer>

<script>
function showMessage() {
    document.getElementById("message").innerHTML =
        "❤️ राज कुमार नायक — RCB का सच्चा फैन! 🏏";
}
</script>

</body>
</html>
